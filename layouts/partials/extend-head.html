{{/*
  longbeach-shore · extend-head.html
  两个独立脚本：
  1. Masonry 错位瀑布流（init 在 DOMContentLoaded）
  2. 诗签 ASCII noise 动画（init 等 fonts.ready）
*/}}

<!-- Vendor: imagesLoaded (本地化) -->
<script src="/vendor/imagesloaded/imagesloaded.pkgd.min.js" defer></script>

<!-- Hero 诗签 ASCII noise + 随机 verse -->
<script src="/js/hitokoto.js" defer></script>
<script>
  (function () {
    // 随机诗池：每句控制在 6-10 字，适配 128px 旋转竖排
    var VERSE_POOL = [
      "无上清凉花满席。",
      "横剑夜听雨浸溪。",
      "庭下如积水空明。",
      "山色有无中。",
      "十笏茅斋寒。",
      "花落人独立。",
      "溪边照影行。",
      "云水自悠悠。",
      "松风吹解带。",
      "江上数峰青。",
      "清露晨流光。",
      "风定花犹落。"
    ];
    function pickVerse() {
      // 不连续两次选同一句
      var last = sessionStorage.getItem("__lastVerse");
      var idx = Math.floor(Math.random() * VERSE_POOL.length);
      while (VERSE_POOL[idx] === last && VERSE_POOL.length > 1) {
        idx = Math.floor(Math.random() * VERSE_POOL.length);
      }
      sessionStorage.setItem("__lastVerse", VERSE_POOL[idx]);
      return VERSE_POOL[idx];
    }

    function init() {
      var wrap = document.querySelector(".entrance-hero__verse-wrap");
      if (!wrap) { console.warn("[verse] wrap not found"); return; }
      var p = wrap.querySelector(".entrance-hero__verse");
      if (!p) { console.warn("[verse] p not found"); return; }
      console.log("[verse] init, p.textContent=", JSON.stringify(p.textContent));
      var final = pickVerse();
      console.log("[verse] picked:", JSON.stringify(final));
      if (!final) { console.warn("[verse] final empty, abort"); return; }

      /* 不拆字符 span，直接换整段 textContent；
         noise 字符串仍然用全角字符（标点 / 几何符号 / ASCII 散字母），
         行宽 = finalLen 字符，layout 不变。 */
      var pool = (
        "·∴∵•◦◌▢△▲▼□◇○●" +
        "@#$%&*+=<>?/|\\:;,.~^[]{}()_-" +
        "ABCDEFGHIJKMNPQRSTUVWXYZ" +
        "abcdefghijkmnopqrstuvwxyz"
      );
      var finalLen = final.length;

      function randLenStr(len) {
        var s = "";
        for (var k = 0; k < len; k++) {
          s += pool.charAt(Math.floor(Math.random() * pool.length));
        }
        return s;
      }

      var passes = 7;
      var i = 0;
      p.textContent = randLenStr(finalLen);
      var tick = setInterval(function () {
        i++;
        /* stableCount 之前稳定，stableCount 之后随机 —— 整段字符随机切换 */
        var stableCount = Math.floor((i / passes) * finalLen);
        var s = "";
        for (var j = 0; j < finalLen; j++) {
          s += j < stableCount
            ? final.charAt(j)
            : pool.charAt(Math.floor(Math.random() * pool.length));
        }
        p.textContent = s;
        if (i >= passes) {
          clearInterval(tick);
          p.textContent = final;
          p.classList.add("is-final");
        }
      }, 90);

      setTimeout(function () {
        clearInterval(tick);
        p.textContent = final;
        p.classList.add("is-final");
      }, 3000);
    }

    /* 等 DOM 完整解析 + 字体都准备好再 init。
       关键 —— `defer` script 跑时 body 还在 parse，所以 init 必须挂到
       DOMContentLoaded（或晚一点的 fontReady）。两个都得等 → 用
       DOMContentLoaded.then(...); fonts.ready 顺序也可，只要晚于 DOM 就绪。 */
    function bootVerse() {
      var fontReady = (document.fonts && document.fonts.ready) || Promise.resolve();
      fontReady.then(function () { init(); });
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootVerse);
    } else {
      bootVerse();
    }
  })();
</script>
